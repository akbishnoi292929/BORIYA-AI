name: Build BORIYA AI VST3 Win7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2022

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache JUCE Framework
      uses: actions/cache@v4
      with:
        path: JUCE
        key: juce-7012-win7-${{ runner.os }}

    - name: Configure CMake for Windows 7
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DJUCE_BUILD_EXTRAS=OFF
        -DJUCE_BUILD_EXAMPLES=OFF
        -G "Ninja"

    - name: Build Targets
      run: cmake --build build --config Release --parallel

    - name: Package Plugins
      shell: bash
      run: |
        mkdir -p dist
        # VST3 bundle clean
        VST_DIR=$(find build -name "BORIYA AI.vst3" -type d | head -n 1)
        if [ -d "$VST_DIR" ]; then
          rm -f "$VST_DIR/Contents/Resources/moduleinfo.json"
          cd "$(dirname "$VST_DIR")"
          7z a -mx=1 -tzip "$GITHUB_WORKSPACE/dist/BORIYA-AI-Win7-x64.zip" "BORIYA AI.vst3"
          cd "$GITHUB_WORKSPACE"
        fi
        
        # VST2 DLL bundle agar generate hua ho
        DLL_FILE=$(find build -name "BORIYA AI.dll" -type f | head -n 1)
        if [ -f "$DLL_FILE" ]; then
          cd "$(dirname "$DLL_FILE")"
          7z a -mx=1 -tzip "$GITHUB_WORKSPACE/dist/BORIYA-AI-Win7-x64.zip" "BORIYA AI.dll"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BORIYA-AI-Win7-x64
        path: dist/BORIYA-AI-Win7-x64.zip
        retention-days: 7
