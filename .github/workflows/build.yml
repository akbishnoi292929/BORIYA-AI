name: Build BORIYA AI VST3 Win7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2022

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: >
        cmake -B build
        -G "Visual Studio 17 2022"
        -A x64
        -DCMAKE_BUILD_TYPE=Release
        -DJUCE_BUILD_EXTRAS=OFF
        -DJUCE_BUILD_EXAMPLES=OFF

    - name: Build Target
      run: cmake --build build --config Release --target BORIYA_AI_VST3 --parallel

    - name: Package VST3
      shell: bash
      run: |
        mkdir -p dist
        VST_DIR=$(find build -name "BORIYA AI.vst3" -type d | head -n 1)
        rm -rf "$VST_DIR/Contents/Resources"
        cd "$(dirname "$VST_DIR")"
        7z a -mx=1 -tzip "$GITHUB_WORKSPACE/dist/BORIYA-AI-Win7-x64.zip" "BORIYA AI.vst3"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BORIYA-AI-Win7-x64
        path: dist/BORIYA-AI-Win7-x64.zip
        retention-days: 7
